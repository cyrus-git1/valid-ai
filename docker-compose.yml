version: "3.9"

services:
  # ── Core API (remaining monolith) ──────────────────────────────────────────
  core:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - TRANSCRIPTION_SERVICE_URL=http://transcription:8001
      - MEMORY_SERVICE_URL=http://memory:8002
      - AGENT_SERVICE_URL=http://agents:8003
    depends_on:
      - transcription
      - memory
      - agents

  # ── Transcription Service ──────────────────────────────────────────────────
  transcription:
    build:
      context: .
      dockerfile: services/transcription/Dockerfile
    ports:
      - "8001:8001"
    env_file: .env

  # ── Memory Service (KG, Embeddings, Chunking, Search) ─────────────────────
  memory:
    build:
      context: .
      dockerfile: services/memory/Dockerfile
    ports:
      - "8002:8002"
    env_file: .env

  # ── Agent Service (Agents, Surveys, Workflows) ────────────────────────────
  agents:
    build:
      context: .
      dockerfile: services/agents/Dockerfile
    ports:
      - "8003:8003"
    env_file: .env
    environment:
      - MEMORY_SERVICE_URL=http://memory:8002
    depends_on:
      - memory
