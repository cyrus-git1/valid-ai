version: "3.9"

services:
  # -- Data Plane (pure storage + retrieval) --
  core:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - AGENT_SERVICE_URL=http://agents:8003

  # -- Agent Service (ingest, context, RAG, surveys, panel, etc.) --
  agents:
    build:
      context: ../valid-agents
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    env_file: .env
    environment:
      - CORE_API_URL=http://core:8000
